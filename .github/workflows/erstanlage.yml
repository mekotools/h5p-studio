name: Erstanlage des Pakets in GHCR

# Diesen Lauf nur von Hand auslösen (workflow_dispatch).
#
# Warum es ihn gibt: ein Paket, das ein fremder Läufer (Forgejo) oder die
# Befehlzeile schiebt, entsteht in GHCR **privat** — und privat lässt es sich
# über die Schnittstelle nicht umstellen (kein Eintrag vorhanden, PATCH/PUT -> 404).
# Wird das Paket dagegen aus einem Arbeitsablauf **dieses** Repos geschoben,
# entsteht es öffentlich und ist anonym ziehbar. Danach darf der Forgejo-Läufer
# weiter schieben — die Sichtbarkeit bleibt.
#
# Reihenfolge bei einem Neuanfang:
#   1. vorhandenes privates Paket löschen (DELETE /orgs/mekotools/packages/container/h5p-studio)
#   2. diesen Lauf starten
#   3. anonyme Ziehbarkeit prüfen: curl -sI https://ghcr.io/v2/mekotools/h5p-studio/manifests/latest
on:
  workflow_dispatch:

jobs:
  erstanlage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelle holen
        uses: actions/checkout@v4

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/mekotools/h5p-studio:latest
            ghcr.io/mekotools/h5p-studio:erstanlage-${{ github.run_number }}

      - name: Sichtbarkeit nachsehen
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/mekotools/packages/container/h5p-studio" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); r=d.get('repository') or {}; print('Sichtbarkeit:', d.get('visibility'), '| verknuepft:', r.get('full_name'))"
