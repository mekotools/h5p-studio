mekotools_studio.bibliothek:
  path: '/bibliothek'
  defaults:
    _controller: '\Drupal\mekotools_studio\Controller\BibliothekController::seite'
    _title: 'Bibliothek'
  requirements:
    _permission: 'access content'

mekotools_studio.kurzweg:
  path: '/studio'
  defaults:
    _controller: '\Drupal\mekotools_studio\Controller\KurzwegController::weiter'
  requirements:
    _permission: 'access content'

# Antrag auf Zugang — ohne Anmeldung erreichbar. Wer noch kein Konto hat, kann
# sich hier melden; erst die Freigabe legt ein Konto im Anmeldedienst an.
mekotools_studio.zugang:
  path: '/zugang'
  defaults:
    _form: '\Drupal\mekotools_studio\Form\ZugangsantragForm'
    _title: 'Zugang zum Studio beantragen'
  requirements:
    _permission: 'access content'

mekotools_studio.zugang_erhalten:
  path: '/zugang/erhalten'
  defaults:
    _controller: '\Drupal\mekotools_studio\Controller\ZugangController::erhalten'
    _title: 'Antrag erhalten'
  requirements:
    _permission: 'access content'

# Freigabeseite — nur für die Verwaltung. Die Übersicht zeigt nur an; das
# Anlegen des Kontos und das Verschicken der Einladung haben je eine eigene
# Bestätigungsseite, weil sie folgenreich sind.
mekotools_studio.antraege:
  path: '/verwaltung/zugangsantraege'
  defaults:
    _controller: '\Drupal\mekotools_studio\Controller\AntraegeController::seite'
    _title: 'Zugangsanträge'
  requirements:
    _permission: 'zugangsantraege verwalten'

mekotools_studio.antrag_freigeben:
  path: '/verwaltung/zugangsantraege/freigeben/{nummer}'
  defaults:
    _form: '\Drupal\mekotools_studio\Form\FreigabeForm'
    _title: 'Zugang freigeben'
  requirements:
    _permission: 'zugangsantraege verwalten'
    nummer: '\d+'

mekotools_studio.antrag_ablehnen:
  path: '/verwaltung/zugangsantraege/ablehnen/{nummer}'
  defaults:
    _form: '\Drupal\mekotools_studio\Form\AblehnungForm'
    _title: 'Antrag ablehnen'
  requirements:
    _permission: 'zugangsantraege verwalten'
    nummer: '\d+'

# Stufe 2: angemeldete Person als Fachkraft bestätigen.
mekotools_studio.antrag_bestaetigen:
  path: '/verwaltung/zugangsantraege/bestaetigen/{nummer}'
  defaults:
    _form: '\Drupal\mekotools_studio\Form\BestaetigungForm'
    _title: 'Als Fachkraft bestätigen'
  requirements:
    _permission: 'zugangsantraege verwalten'
    nummer: '\d+'
