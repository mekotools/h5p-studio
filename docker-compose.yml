# MekoTools — Studio (H5P-Inhalte erstellen, sammeln, abspielen)
# Ablage auf flip: /poolio/docker/mekotools-studio/docker-compose.yml
# Start:            cd /poolio/docker/mekotools-studio && docker compose up -d
# Adresse:          https://studio.mekotools.de
#
# Zwei Behälter, bewusst:
#  * web        — eigenes Abbild (Drupal 11 + amtliches H5P-Modul + eigener Aufsatz).
#  * datenbank  — MariaDB für Inhalte, Konten, Einstellungen.
#
# Netze, nach Hausordnung (gilt für alle Dienste):
#  * Nur der Dienst, den der Verwalter erreichen muss, hängt am Netz `coolify`.
#  * Alle inneren Dienste (Datenbank, Zwischenspeicher) hängen AUSSCHLIESSLICH im
#    eigenen Stapelnetz `intern` — im Projektnetz wäre jeder fremde Behälter
#    mitleseberechtigt.
#  * Hängt ein Behälter an mehreren Netzen, MUSS `traefik.docker.network`
#    ausdrücklich gesetzt werden — sonst rät der Verwalter.
#
# Drei Fallen, am 09.10.2026 schmerzhaft gelernt und deshalb hier vermerkt:
#  1. Eine scheiternde Gesundheitsprobe führt dazu, dass der Verwalter den
#     Behälter GAR NICHT als Ziel führt — die Adresse antwortet dann mit seinem
#     eigenen 404 (text/plain, 19 Byte), obwohl alle Kennzeichnungen stimmen.
#     Deshalb erlaubt die Adressprüfung der Anwendung ausdrücklich 127.0.0.1.
#  2. Der Dienst heißt NICHT "db". Im Netz `coolify` tragen fremde Stapel
#     (mekotools-opencut-db, mekotools-claper-db) denselben kurzen Namen; Docker
#     löst ihn über alle Netze des Behälters auf, und die Anwendung landete
#     dadurch beim fremden Dienst ("Connection refused").
#  3. Der Name des Stapelordners bestimmt die Namen der Datenträger. Beim
#     Umbenennen (h5p-studio → studio am 09.10.2026) müssen die Datenträger
#     mitwandern, sonst beginnt die Anwendung mit leerer Datenbank.
services:
  web:
    # Festgenagelt auf den Verdauungswert aus der Fertigung (im Protokoll des
    # Laufs ablesen). Nach einem neuen Lauf: Wert hier nachziehen, dann
    #   docker compose pull web && docker compose up -d --no-deps web
    # Rückweg bei kaputtem Stand: vorherigen Wert zurückschreiben, up -d, fertig.
    image: ghcr.io/mekotools/h5p-studio@sha256:WIRD-NACH-DEM-ERSTEN-LAUF-EINGETRAGEN
    container_name: mekotools-studio
    restart: unless-stopped
    env_file: .env
    depends_on:
      datenbank:
        condition: service_healthy
    volumes:
      - daten:/daten
    networks: [coolify, intern]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.mekotools-studio.rule=Host(`studio.mekotools.de`)
      - traefik.http.routers.mekotools-studio.entrypoints=http
      - traefik.http.middlewares.mekotools-scheme-studio.headers.customrequestheaders.X-Forwarded-Host=studio.mekotools.de
      - traefik.http.middlewares.mekotools-scheme-studio.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.mekotools-scheme-studio.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.mekotools-studio.middlewares=mekotools-scheme-studio
      - traefik.http.services.mekotools-studio.loadbalancer.server.port=80
      # Der alte Name (bis 09.10.2026) leitet dauerhaft weiter, damit gesetzte
      # Lesezeichen nicht ins Leere laufen.
      - traefik.http.middlewares.mekotools-studio-umzug.redirectregex.regex=^https?://h5p-studio\.mekotools\.de/(.*)
      - traefik.http.middlewares.mekotools-studio-umzug.redirectregex.replacement=https://studio.mekotools.de/$${1}
      - traefik.http.middlewares.mekotools-studio-umzug.redirectregex.permanent=true
      - traefik.http.routers.mekotools-studio-umzug.rule=Host(`h5p-studio.mekotools.de`)
      - traefik.http.routers.mekotools-studio-umzug.entrypoints=http
      - traefik.http.routers.mekotools-studio-umzug.middlewares=mekotools-studio-umzug
      - traefik.http.routers.mekotools-studio-umzug.service=mekotools-studio

  datenbank:
    image: mariadb:11.4
    container_name: mekotools-studio-db
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=64M
      --innodb-buffer-pool-size=256M
    environment:
      - MARIADB_DATABASE=${STUDIO_DB_NAME}
      - MARIADB_USER=${STUDIO_DB_USER}
      - MARIADB_PASSWORD=${STUDIO_DB_PASS}
      - MARIADB_ROOT_PASSWORD=${STUDIO_DB_ROOT_PASS}
    volumes:
      - db:/var/lib/mysql
    networks: [intern]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  daten:
  db:

networks:
  coolify:
    external: true
  intern:
    internal: true
