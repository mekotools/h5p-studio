# MekoTools — H5P-Studio
# Ablage auf flip: /poolio/docker/mekotools-h5p-studio/docker-compose.yml
# Start:            cd /poolio/docker/mekotools-h5p-studio && docker compose up -d
#
# Zwei Behälter, bewusst:
#  * web         — unser eigenes Abbild (Drupal 11 + H5P-Modul + eigener Aufsatz).
#  * datenbank   — MariaDB für Inhalte, Konten, Einstellungen.
#
# Netze, nach Hausordnung:
#  * web hängt an `coolify` (damit der Verwalter es erreicht) UND am eigenen
#    Stapelnetz `intern` (zur Datenbank).
#  * Die Datenbank hängt AUSSCHLIESSLICH an `intern` — ein Dienst im Netz des
#    gesamten Projekts wäre für jeden anderen Behälter offen.
#  * Weil der Behälter an zwei Netzen hängt, muss `traefik.docker.network`
#    ausdrücklich gesetzt werden, sonst rät der Verwalter und überspringt den
#    Behälter unter Umständen.
#
# Zwei Fallen, am 09.10.2026 schmerzhaft gelernt und deshalb hier vermerkt:
#  1. Eine scheiternde Gesundheitsprobe führt dazu, dass der Verwalter den
#     Behälter GAR NICHT als Ziel führt — die Adresse antwortet dann mit seinem
#     eigenen 404 (text/plain, 19 Byte), obwohl alle Kennzeichnungen stimmen.
#     Deshalb erlaubt die Adressprüfung der Anwendung ausdrücklich 127.0.0.1.
#  2. Der Dienst heißt NICHT "db". Im Netz `coolify` tragen fremde Stapel
#     (mekotools-opencut-db, mekotools-claper-db) denselben kurzen Namen; Docker
#     löst ihn über alle Netze des Behälters auf, und die Anwendung landete
#     dadurch beim fremden Dienst ("Connection refused").
services:
  web:
    # Festgenagelt auf den Verdauungswert aus der Fertigung (im Protokoll des
    # Laufs ablesen). Nach einem neuen Lauf: Wert hier nachziehen, dann
    #   docker compose pull web && docker compose up -d --no-deps web
    # Rückweg bei kaputtem Stand: vorherigen Wert zurückschreiben, up -d, fertig.
    image: ghcr.io/mekotools/h5p-studio@sha256:WIRD-NACH-DEM-ERSTEN-LAUF-EINGETRAGEN
    container_name: mekotools-h5p-studio
    restart: unless-stopped
    env_file: .env
    depends_on:
      datenbank:
        condition: service_healthy
    volumes:
      - daten:/daten
    networks: [coolify, intern]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.mekotools-h5p-studio.rule=Host(`h5p-studio.mekotools.de`)
      - traefik.http.routers.mekotools-h5p-studio.entrypoints=http
      - traefik.http.middlewares.mekotools-scheme-h5p-studio.headers.customrequestheaders.X-Forwarded-Host=h5p-studio.mekotools.de
      - traefik.http.middlewares.mekotools-scheme-h5p-studio.headers.customrequestheaders.X-Forwarded-Port=443
      - traefik.http.middlewares.mekotools-scheme-h5p-studio.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.mekotools-h5p-studio.middlewares=mekotools-scheme-h5p-studio
      - traefik.http.services.mekotools-h5p-studio.loadbalancer.server.port=80

  datenbank:
    image: mariadb:11.4
    container_name: mekotools-h5p-studio-db
    restart: unless-stopped
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-allowed-packet=64M
      --innodb-buffer-pool-size=256M
    environment:
      - MARIADB_DATABASE=${STUDIO_DB_NAME}
      - MARIADB_USER=${STUDIO_DB_USER}
      - MARIADB_PASSWORD=${STUDIO_DB_PASS}
      - MARIADB_ROOT_PASSWORD=${STUDIO_DB_ROOT_PASS}
    volumes:
      - db:/var/lib/mysql
    networks: [intern]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  daten:
  db:

networks:
  coolify:
    external: true
  intern:
    internal: true
